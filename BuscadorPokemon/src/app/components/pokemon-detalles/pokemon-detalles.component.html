<div>
    @if(cargando){
        <h2>Cargando datos... espere en linea por favor</h2>
    }@else if(pokemonData){
        <div>
            <h1>{{pokemonData.name}}</h1>
            <img [src]="pokemonData.sprite.other['official-artwork'].front_default">
            <h3>Estadistica base</h3>
            <ul>
                @for(stat of pokemonData.stat; track stat.stat.name){
                    <li>{{stat.stat.name}}: {{stat.base_stat}}</li>
                }
            </ul>
            <a routerLink="/">Volver a la lista</a>
        </div>
    }@else{
        <h2>Pokemon no fue encontrado!</h2>
    }
</div>
